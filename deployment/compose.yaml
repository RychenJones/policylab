name: policylab
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: policylab-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
